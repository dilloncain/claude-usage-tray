<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Claude Usage</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div class="card" id="card">
    <header class="bar">
      <div class="title">
        <span class="dot" id="dot"></span>
        <span>Claude usage</span>
        <span class="plan" id="plan"></span>
      </div>
      <div class="actions">
        <button id="refresh" title="Refresh now" aria-label="Refresh now">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="menu" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>
        </button>
        <button id="hide" title="Hide (click the tray icon to show again)" aria-label="Hide">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="body">
      <p class="muted">Loading…</p>
    </main>

    <footer class="foot">
      <span id="updated"></span>
    </footer>
  </div>
  <script src="widget.js"></script>
</body>
</html>
